name: Core quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      VERITAS_MODE: demo
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0
          python -m pip install -e ".[ui,dev,security]"

      - name: Verify formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -v

      - name: Build source-only wheel
        run: python -m pip wheel --no-deps . --wheel-dir wheelhouse

      - name: Reject cached bytecode in wheel
        run: >-
          python -c "import pathlib, zipfile;
          wheel=next(pathlib.Path('wheelhouse').glob('*.whl'));
          names=zipfile.ZipFile(wheel).namelist();
          forbidden=[name for name in names if '__pycache__' in name or name.endswith('.pyc')];
          assert not forbidden, forbidden"

      - name: Compile every Python module
        run: >-
          python -m compileall -q
          agents audit config consistency core correction graph retrieval scoring ui

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit installed dependencies
        run: python -m pip_audit --local --skip-editable --progress-spinner off
