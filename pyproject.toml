[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-research-workbench"
version = "2.1.0"
description = "Evidence-aggregation research prototype with explicit demo and live modes"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Siddhant Chandorkar" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "defusedxml==0.7.1",
  "numpy==2.4.4",
  "openai==3.3.1",
  "pydantic==2.13.4",
  "requests==2.34.2",
]

[project.optional-dependencies]
ui = [
  "networkx==3.6.1",
  "plotly==6.9.0",
  "streamlit==1.62.0",
]
dev = ["ruff==0.16.4"]
security = ["pip-audit==2.10.1"]

[project.urls]
Repository = "https://github.com/siddhantchandorkar752-ai/VERITAS-2"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
include = [
  "agents*",
  "audit*",
  "config*",
  "consistency*",
  "core*",
  "correction*",
  "graph*",
  "retrieval*",
  "scoring*",
  "ui*",
]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = [
  "agents",
  "audit",
  "config",
  "consistency",
  "core",
  "correction",
  "graph",
  "retrieval",
  "scoring",
  "ui",
]
